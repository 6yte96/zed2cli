# Publishing is just a push to main.
#
#   git push origin main
#
# This workflow:
#   1. runs every check (npm run prepublishOnly),
#   2. reads the version from package.json,
#   3. publishes it to npm if that exact version is not already on npm,
#   4. creates the matching git tag vX.Y.Z and a GitHub release for it,
#   5. does nothing if the version is unchanged, so ordinary pushes are safe.
#
# Authentication uses npm trusted publishing (OIDC). There is no npm token
# stored anywhere. The job only needs the id-token: write permission, and npm
# exchanges GitHub's OIDC identity for a short lived publish credential and
# attaches a provenance statement automatically.
#
# One time setup on npmjs.com, in the zed2cli package settings under Trusted
# Publisher, add a GitHub Actions publisher:
#   Organization or user : 6yte96
#   Repository           : zed2cli
#   Workflow filename    : publish.yml
#   Environment name     : leave empty
#   Allowed actions      : enable "Allow npm publish"
# See RELEASING.md for the full walkthrough.
name: Publish

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write # create and push the version tag, create the release
      id-token: write # trusted publishing: lets npm verify this workflow
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify
        run: npm run prepublishOnly

      - name: Check whether this version is already on npm
        id: version
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "zed2cli@$version" version >/dev/null 2>&1; then
            echo "zed2cli@$version is already on npm"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "zed2cli@$version is new"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.version.outputs.publish == 'true'
        # No token and no --provenance: trusted publishing supplies both.
        run: npm publish

      - name: Tag the release
        if: steps.version.outputs.publish == 'true'
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "tag $TAG already exists, leaving it in place"
          else
            git tag -a "$TAG" -m "zed2cli ${TAG#v}"
            git push origin "$TAG"
            echo "tagged $TAG"
          fi

      - name: Create the GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists, leaving it in place"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi

      - name: Nothing to publish
        if: steps.version.outputs.publish != 'true'
        run: |
          echo "zed2cli@${{ steps.version.outputs.version }} is already published."
          echo "Bump the version in package.json and push to main to release."
