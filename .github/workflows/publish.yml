# Publishing is just a push to main.
#
#   git push origin main
#
# This workflow:
#   1. runs every check (npm run prepublishOnly),
#   2. reads the version from package.json,
#   3. publishes it to npm with provenance if that exact version is not
#      already on npm,
#   4. does nothing if the version is unchanged, so ordinary pushes are safe.
#
# So to ship a release: bump the version in package.json, commit, and push to
# main. Push without a version bump and the run simply skips publishing.
#
# No tags, no approvals, no GitHub environment, no manual trigger.
#
# One time setup: add an npm automation token with publish rights to the
# package as the repository secret NPM_TOKEN (Settings, Secrets and
# variables, Actions). Nothing else is required.
name: Publish

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Verify
        run: npm run prepublishOnly

      - name: Check whether this version is already on npm
        id: version
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "zed2cli@$version" version >/dev/null 2>&1; then
            echo "zed2cli@$version is already on npm"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "zed2cli@$version is new"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.version.outputs.publish == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Nothing to publish
        if: steps.version.outputs.publish != 'true'
        run: |
          echo "zed2cli@${{ steps.version.outputs.version }} is already published."
          echo "Bump the version in package.json and push to main to release."
